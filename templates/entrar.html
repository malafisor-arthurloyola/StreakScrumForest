<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1511">
  <meta name="robots" content="noindex">
  <title>Entrar · Jardim da Equipe</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="entrar">
  <main class="entrar-caixa">
    <svg class="entrar-logo" viewBox="0 0 48 48" aria-hidden="true">
      <rect width="48" height="48" rx="14" fill="#c6f24e"/>
      <path d="M24 39V24" fill="none" stroke="#12200a" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M24 27C15.5 27 11.5 22 11.5 14.5C19.5 14.5 24 19 24 27Z" fill="#12200a"/>
      <path d="M24 23C24 13.5 30 8 38.5 8C38.5 17.5 33.5 23 24 23Z" fill="#12200a"/>
    </svg>
    <h1>Jardim da Equipe</h1>
    <p class="sub">Digite o código de acesso do grupo para entrar.</p>

    <form method="post" action="{{ url_for('entrar') }}" class="entrar-form">
      <input type="hidden" name="next" value="{{ destino }}">
      <label for="codigo">Código de acesso</label>
      <input type="password" id="codigo" name="codigo" autocomplete="current-password" autofocus required>
      {% if erro %}<p class="entrar-erro" role="alert">{{ erro }}</p>{% endif %}
      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
  </main>
</body>
</html>
