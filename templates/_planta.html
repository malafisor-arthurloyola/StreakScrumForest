{% macro planta(membro, tamanho=160) %}
{% set s = membro.estagio %}
{% set v = membro.vigor %}
{% set f = membro.floresceu %}
{% set frutos = membro.frutos %}
{% set w = tamanho %}
{% set h = tamanho %}
<svg
  class="planta-svg"
  viewBox="0 0 100 120"
  width="{{ w }}"
  height="{{ h }}"
  data-member-id="{{ membro.id }}"
  data-stage="{{ s }}"
  data-vigor="{{ v }}"
  data-floresceu="{{ 'true' if f else 'false' }}"
  aria-label="Planta de {{ membro.name }}, estagio {{ membro.estagio_nome }}"
>
  <defs>
    <radialGradient id="vaso-grad-{{ membro.id }}" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4a3f2a" />
      <stop offset="100%" stop-color="#2e2218" />
    </radialGradient>
  </defs>

  {% set terra_y = 90 %}
  {% set caule_base_x = 50 %}

  <rect x="32" y="{{ terra_y }}" width="36" height="24" rx="4"
        fill="url(#vaso-grad-{{ membro.id }})" />
  <ellipse cx="50" cy="{{ terra_y }}" rx="18" ry="5" fill="#3a2e1c" />

  {% if s == 0 %}
    <ellipse cx="50" cy="{{ terra_y - 3 }}" rx="8" ry="4" fill="#5a4a2a" opacity="0.7" />
    <ellipse cx="50" cy="{{ terra_y - 6 }}" rx="4" ry="3" fill="#6b5a36" opacity="0.8" />
  {% endif %}

  {% if s >= 1 %}
    <line x1="{{ caule_base_x }}" y1="{{ terra_y }}" x2="{{ caule_base_x }}" y2="{{ terra_y - 12 }}"
          stroke="#5a7a3a" stroke-width="2.5" stroke-linecap="round" />
    <ellipse cx="50" cy="{{ terra_y - 14 }}" rx="7" ry="5"
             fill="#4a8a3a" opacity="{{ '1' if v != 'murcha' else '0.5' }}" />
  {% endif %}

  {% if s >= 2 %}
    <line x1="{{ caule_base_x }}" y1="{{ terra_y }}" x2="{{ caule_base_x }}" y2="{{ terra_y - 28 }}"
          stroke="#5a7a3a" stroke-width="2.5" stroke-linecap="round" />
    <ellipse cx="42" cy="{{ terra_y - 24 }}" rx="9" ry="6"
             fill="#5aaa4a" transform="rotate(-20,42,{{ terra_y - 24 }})"
             opacity="{{ '1' if v != 'murcha' else '0.4' }}" />
    <ellipse cx="58" cy="{{ terra_y - 20 }}" rx="9" ry="6"
             fill="#4a9a3a" transform="rotate(15,58,{{ terra_y - 20 }})"
             opacity="{{ '1' if v != 'murcha' else '0.4' }}" />
  {% endif %}

  {% if s >= 3 %}
    <line x1="{{ caule_base_x }}" y1="{{ terra_y }}" x2="{{ caule_base_x }}" y2="{{ terra_y - 44 }}"
          stroke="#5a7a3a" stroke-width="2.5" stroke-linecap="round" />
    <ellipse cx="38" cy="{{ terra_y - 38 }}" rx="10" ry="7"
             fill="#6bbf50" transform="rotate(-30,38,{{ terra_y - 38 }})"
             opacity="{{ '1' if v != 'murcha' else '0.35' }}" />
    <ellipse cx="62" cy="{{ terra_y - 35 }}" rx="10" ry="7"
             fill="#5ab545" transform="rotate(25,62,{{ terra_y - 35 }})"
             opacity="{{ '1' if v != 'murcha' else '0.35' }}" />
    <ellipse cx="50" cy="{{ terra_y - 44 }}" rx="8" ry="6"
             fill="#6dc855" opacity="{{ '1' if v != 'murcha' else '0.35' }}" />
  {% endif %}

  {% if s >= 4 %}
    <line x1="{{ caule_base_x }}" y1="{{ terra_y }}" x2="{{ caule_base_x }}" y2="{{ terra_y - 58 }}"
          stroke="#4e6e30" stroke-width="3" stroke-linecap="round" />
    <ellipse cx="35" cy="{{ terra_y - 50 }}" rx="12" ry="8"
             fill="#72cc56" transform="rotate(-35,35,{{ terra_y - 50 }})"
             opacity="{{ '0.9' if v != 'murcha' else '0.3' }}" />
    <ellipse cx="65" cy="{{ terra_y - 48 }}" rx="12" ry="8"
             fill="#65c44a" transform="rotate(30,65,{{ terra_y - 48 }})"
             opacity="{{ '0.9' if v != 'murcha' else '0.3' }}" />
    <ellipse cx="50" cy="{{ terra_y - 60 }}" rx="10" ry="8"
             fill="#7ad560" opacity="{{ '0.95' if v != 'murcha' else '0.3' }}" />
  {% endif %}

  {% if s >= 5 %}
    <ellipse cx="30" cy="{{ terra_y - 62 }}" rx="13" ry="9"
             fill="#80d864" transform="rotate(-40,30,{{ terra_y - 62 }})"
             opacity="{{ '0.95' if v == 'radiante' else '0.8' if v != 'murcha' else '0.25' }}" />
    <ellipse cx="70" cy="{{ terra_y - 60 }}" rx="13" ry="9"
             fill="#74cd58" transform="rotate(35,70,{{ terra_y - 60 }})"
             opacity="{{ '0.95' if v == 'radiante' else '0.8' if v != 'murcha' else '0.25' }}" />
    <ellipse cx="50" cy="{{ terra_y - 70 }}" rx="14" ry="10"
             fill="#8ae06e"
             opacity="{{ '1' if v == 'radiante' else '0.85' if v != 'murcha' else '0.25' }}" />
  {% endif %}

  {% if s >= 6 %}
    <ellipse cx="50" cy="{{ terra_y - 74 }}" rx="18" ry="14"
             fill="#7ed65e" opacity="{{ '0.9' if v != 'murcha' else '0.2' }}" />
    <ellipse cx="32" cy="{{ terra_y - 72 }}" rx="14" ry="10"
             fill="#90e070" transform="rotate(-45,32,{{ terra_y - 72 }})"
             opacity="{{ '0.85' if v != 'murcha' else '0.2' }}" />
    <ellipse cx="68" cy="{{ terra_y - 70 }}" rx="14" ry="10"
             fill="#82d862" transform="rotate(40,68,{{ terra_y - 70 }})"
             opacity="{{ '0.85' if v != 'murcha' else '0.2' }}" />
  {% endif %}

  {% if s >= 7 %}
    {% for i in range(3) %}
    <circle cx="{{ 42 + i * 8 }}" cy="{{ terra_y - 82 }}" r="4"
            fill="#e8a0d8" opacity="0.85" />
    {% endfor %}
  {% endif %}

  {% if s >= 8 %}
    {% for i in range(5) %}
    <circle cx="{{ 34 + i * 8 }}" cy="{{ terra_y - 86 }}" r="5"
            fill="#f0b0e0"
            opacity="{{ '0.95' if v in ('florida', 'radiante') else '0.7' }}" />
    {% endfor %}
    {% for i in range(3) %}
    <circle cx="{{ 38 + i * 12 }}" cy="{{ terra_y - 94 }}" r="4"
            fill="#e090cc" opacity="0.8" />
    {% endfor %}
  {% endif %}

  {% if s >= 9 %}
    {% for i in range(frutos) %}
    <circle cx="{{ 36 + i * 7 }}" cy="{{ terra_y - 78 }}" r="4"
            fill="#ff7070" opacity="0.9" />
    {% endfor %}
  {% endif %}

  {% if s == 10 or f %}
    <circle cx="50" cy="{{ terra_y - 96 }}" r="10"
            fill="#ffe066" opacity="0.95" />
    <line x1="50" y1="{{ terra_y - 106 }}" x2="50" y2="{{ terra_y - 114 }}"
          stroke="#ffe066" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <line x1="58.7" y1="{{ terra_y - 101 }}" x2="63.9" y2="{{ terra_y - 107 }}"
          stroke="#ffe066" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <line x1="58.7" y1="{{ terra_y - 91 }}" x2="63.9" y2="{{ terra_y - 86 }}"
          stroke="#ffe066" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <line x1="50" y1="{{ terra_y - 86 }}" x2="50" y2="{{ terra_y - 78 }}"
          stroke="#ffe066" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <line x1="41.3" y1="{{ terra_y - 91 }}" x2="36.1" y2="{{ terra_y - 86 }}"
          stroke="#ffe066" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <line x1="41.3" y1="{{ terra_y - 101 }}" x2="36.1" y2="{{ terra_y - 107 }}"
          stroke="#ffe066" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  {% endif %}

  {% if v == 'radiante' and s >= 4 %}
    <circle cx="24" cy="{{ terra_y - 40 }}" r="2.5" fill="#ffe066" opacity="0.7" />
    <circle cx="76" cy="{{ terra_y - 35 }}" r="2" fill="#ffe066" opacity="0.6" />
    <circle cx="20" cy="{{ terra_y - 60 }}" r="1.8" fill="#ffe066" opacity="0.5" />
  {% endif %}
</svg>
{% endmacro %}
